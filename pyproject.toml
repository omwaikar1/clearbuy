[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "eval*"]

[project]
name = "clearbuy-backend"
version = "0.1.0"
description = "ClearBuy — Verified Spatial Commerce Compiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pillow>=10.4.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
depth = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
